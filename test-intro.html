<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavi Tik Medya Ajansı — Apple Keynote Intro (Kusursuz & Net)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #02050E;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ==============================================================
           APPLE & CYBERPUNK ULTRA-LUXE KEYNOTE INTRO STAGE
           ============================================================== */
        #apple-intro {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: radial-gradient(circle at center, #050d22 0%, #02040a 55%, #010206 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1400px;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.85s ease;
            will-change: opacity, transform;
        }

        #apple-intro.intro-dismissed {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.06);
            pointer-events: none;
        }

        /* 1. Nebula & Aurora Parıltıları */
        .ambient-aurora {
            position: absolute;
            width: 800px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(0, 194, 255, 0.2) 0%, rgba(0, 98, 255, 0.1) 45%, transparent 70%);
            filter: blur(80px);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1;
        }

        .ambient-aurora.ignited {
            opacity: 1;
            transform: scale(1.15);
        }

        /* 2. Geometrik Precision Grid (Hafif ve Derin) */
        .precision-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 80%);
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 2;
            pointer-events: none;
        }

        .precision-grid.active {
            opacity: 0.8;
        }

        /* 3. Yatay Kristal Işık Parlaması (Anamorfik Flare)
           - Tam logonun merkez hizasında parlar, metinlerin üstüne binmez! */
        .crystal-beam {
            position: absolute;
            top: calc(50% - 90px);
            left: 50%;
            transform: translate(-50%, -50%) scaleX(0);
            width: 90vw;
            max-width: 1100px;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 194, 255, 0.2) 20%, 
                rgba(0, 194, 255, 0.95) 45%, 
                #FFFFFF 50%, 
                rgba(0, 194, 255, 0.95) 55%, 
                rgba(0, 194, 255, 0.2) 80%, 
                transparent 100%);
            box-shadow: 0 0 25px 3px rgba(0, 194, 255, 0.8), 0 0 50px 8px rgba(0, 98, 255, 0.45);
            z-index: 5;
            pointer-events: none;
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            opacity: 0;
        }

        .crystal-beam.active {
            opacity: 0.9;
            transform: translate(-50%, -50%) scaleX(1);
        }

        /* Logo oturduktan sonra ışık huzmesi zarifçe solar, kalabalık yapmaz */
        .crystal-beam.faded {
            opacity: 0.25;
            transition: opacity 0.6s ease;
        }

        /* ==============================================================
           4. KİNETİK LAZER ÇİZGİLERİ (SVG IŞIK HATLARI)
           - Sol ve sağdan akıp logoya enerjiyi verir, sonra sahneyi temiz bırakır!
           ============================================================== */
        .laser-streams-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .laser-streams-svg.faded {
            opacity: 0;
        }

        .laser-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: miter;
            transition: stroke-dashoffset 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 10px rgba(0, 194, 255, 0.9));
        }

        /* ==============================================================
           5. MERKEZ SAHNESİ: FERAH, NET VE ASLA ÜST ÜSTE BİNMEYEN YAPI
           ============================================================== */
        .center-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 800px;
            width: 90%;
            padding: 20px;
        }

        /* 3D Cam Kaide (Frosted Glass Pedestal) */
        .glass-emblem-card {
            position: relative;
            width: 132px;
            height: 132px;
            border-radius: 36px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(20px) scale(0.9) rotateX(12deg);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.7s ease;
            will-change: transform, opacity;
        }

        .glass-emblem-card.revealed {
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
            box-shadow: 
                0 35px 70px -10px rgba(0, 98, 255, 0.45),
                0 0 50px rgba(0, 194, 255, 0.3),
                0 0 0 1px rgba(0, 194, 255, 0.4),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.6);
        }

        /* Cam Üzerindeki Çevre Lazer Çizgisi */
        .contour-laser-svg {
            position: absolute;
            inset: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .contour-laser-rect {
            stroke-dasharray: 480;
            stroke-dashoffset: 480;
            stroke: url(#cardLaserGrad);
            stroke-width: 2.5;
            stroke-linecap: round;
            fill: none;
            filter: drop-shadow(0 0 8px rgba(0, 194, 255, 0.9));
            transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.08s;
        }

        .glass-emblem-card.revealed .contour-laser-rect {
            stroke-dashoffset: 0;
        }

        /* Resmi Marka Amblemi */
        .official-logo-img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 194, 255, 0.9)) drop-shadow(0 8px 24px rgba(0, 98, 255, 0.6));
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.4s ease 0.05s, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
            position: relative;
            z-index: 2;
            display: block;
        }

        .glass-emblem-card.revealed .official-logo-img {
            opacity: 1;
            transform: scale(1);
        }

        

        /* ==============================================================
           6. TİPOGRAFİ (NET, DÜZENLİ VE FERAH DİZİLİM)
           ============================================================== */
        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.55s ease 0.15s, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
        }

        .title-block.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* 1. Satır: MAVİ TİK */
        .brand-headline {
            font-size: clamp(38px, 5.5vw, 54px);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 8px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .brand-headline .grad-text {
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 30%, #38BDF8 60%, #00C2FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 18px rgba(0, 194, 255, 0.35));
        }

        .brand-headline .ig-verified-badge {
            width: clamp(28px, 4vw, 40px);
            height: clamp(28px, 4vw, 40px);
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
            filter: drop-shadow(0 0 16px rgba(0, 149, 246, 0.85)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
        }

        .brand-headline:hover .ig-verified-badge {
            transform: scale(1.08);
            filter: drop-shadow(0 0 24px rgba(0, 194, 255, 1)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        /* 2. Satır: MEDYA AJANSI (Temiz Kurumsal Alt Başlık) */
        .brand-subline {
            font-size: clamp(14px, 1.8vw, 17px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #94A3B8;
            margin-bottom: 18px;
        }

        /* 3. Satır: Tek Zarif Lazer Çizgisi */
        .laser-divider {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #0062FF 20%, 
                #00C2FF 50%, 
                #FFFFFF 60%, 
                #00C2FF 70%, 
                #0062FF 80%, 
                transparent 100%);
            box-shadow: 0 0 15px #00C2FF;
            margin-bottom: 20px;
            border-radius: 999px;
            transition: width 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s;
        }

        .title-block.revealed .laser-divider {
            width: 240px;
        }

        /* 4. Satır: Tek Seçkin Prestij Rozeti */
        .prestige-pill {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 22px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(14px);
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .prestige-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00C2FF;
            box-shadow: 0 0 10px #00C2FF, 0 0 18px #00C2FF;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* ==============================================================
           7. KONTROLLER: İNTROYU GEÇ & MİKRO İLERLEME
           ============================================================== */
        .apple-skip-btn {
            position: absolute;
            top: 28px;
            right: 32px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            color: #94A3B8;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: all 0.25s ease;
            outline: none;
        }

        .apple-skip-btn:hover {
            color: #FFFFFF;
            background: rgba(0, 194, 255, 0.15);
            border-color: rgba(0, 194, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 194, 255, 0.25);
        }

        .apple-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: linear-gradient(90deg, #0040A8, #0062FF, #00C2FF, #FFFFFF);
            box-shadow: 0 0 10px rgba(0, 194, 255, 0.9);
            transition: width 2.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        /* Önizleme Alanı */
        .demo-site-content {
            padding: 120px 24px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .demo-site-content h1 {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #FFFFFF;
        }

        .demo-site-content p {
            font-size: 17px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .replay-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            background: linear-gradient(135deg, #0062FF 0%, #00C2FF 100%);
            color: #fff;
            border: none;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 98, 255, 0.45);
            transition: all 0.25s ease;
        }

        .replay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 194, 255, 0.65);
        }

        @media (max-width: 640px) {
            .glass-emblem-card { width: 110px; height: 110px; border-radius: 30px; margin-bottom: 22px; }
            .official-logo-img { width: 78px; height: 78px; }
            .brand-headline { font-size: 32px; }
            .brand-headline .ig-verified-badge { width: 24px; height: 24px; }
            .brand-subline { font-size: 12px; letter-spacing: 5px; margin-bottom: 14px; }
            .laser-divider { margin-bottom: 16px; }
            .title-block.revealed .laser-divider { width: 170px; }
            .prestige-pill { font-size: 12px; padding: 7px 16px; }
            .apple-skip-btn { top: 16px; right: 16px; padding: 7px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- ==============================================================
         APPLE & CYBERPUNK ULTRA-LUXE KEYNOTE INTRO
         ============================================================== -->
    <div id="apple-intro">
        <!-- 1. Derin Lüks Aurora Işığı -->
        <div class="ambient-aurora" id="ambientAurora"></div>

        <!-- 2. Hassas Cyber Izgara Deseni -->
        <div class="precision-grid" id="precisionGrid"></div>

        <!-- 3. Yatay Kristal Işık Çizgisi (Logonun Merkez Arkasında Parlar) -->
        <div class="crystal-beam" id="crystalBeam"></div>

        <!-- 4. Kinetik Lazer Akış Çizgileri (SVG) -->

            <defs>
                <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00C2FF" stop-opacity="0" />
                    <stop offset="60%" stop-color="#00C2FF" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
                </linearGradient>
                <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0062FF" stop-opacity="0" />
                    <stop offset="60%" stop-color="#00C2FF" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#38BDF8" stop-opacity="1" />
                </linearGradient>
                <linearGradient id="cardLaserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00C2FF" />
                    <stop offset="50%" stop-color="#FFFFFF" />
                    <stop offset="100%" stop-color="#0062FF" />
                </linearGradient>
            </defs>

            <!-- Sol Kanattan Merkeze Kayan Işık Çizgisi -->
            <!-- Sol Kanattan Merkeze Kayan Keskin M Işını -->
            <path id="laserStreamLeft" class="laser-path"
                  d="M -50,520 L 420,180 L 600,365"
                  stroke="url(#streamGrad1)" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="miter"
                  stroke-dasharray="1000" stroke-dashoffset="1000" />

            <!-- Sağ Kanattan Merkeze Kayan Keskin M Işını -->
            <path id="laserStreamRight" class="laser-path"
                  d="M 1250,520 L 780,180 L 600,365"
                  stroke="url(#streamGrad2)" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="miter"
                  stroke-dasharray="1000" stroke-dashoffset="1000" />
        </svg>

        <!-- 5. İntroyu Geç Butonu -->
        <button class="apple-skip-btn" id="appleSkipBtn">
            <span>İntroyu Geç</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- 6. Mikro İlerleme Çubuğu -->
        <div class="apple-progress" id="appleProgress"></div>

        <!-- 7. Merkez Sahnesi (Tertemiz, Ferah, Asla Çakışmayan Hiyerarşi) -->

            <!-- 3D Buzlu Cam Kaide -->
            <div class="glass-emblem-card" id="glassEmblem">
                <svg class="contour-laser-svg" viewBox="0 0 160 160">
                    <rect class="contour-laser-rect" x="12" y="12" width="136" height="136" rx="38" />

        <h1>Mavi Tik Medya Ajansı</h1>
        <p>Gereksiz katmanlar temizlendi: Ferah, net, kristal berraklığında Apple Keynote düzeni.</p>
        <button class="replay-btn" onclick="playAppleIntro()">
            <i class="fa-solid fa-rotate-right"></i> İntroyu Yeniden Oynat
        </button>
    </div>

    <script>
        const appleIntro = document.getElementById('apple-intro');
        const ambientAurora = document.getElementById('ambientAurora');
        const precisionGrid = document.getElementById('precisionGrid');
        const crystalBeam = document.getElementById('crystalBeam');
        const laserStreamsSvg = document.getElementById('laserStreamsSvg');
        const laserStreamLeft = document.getElementById('laserStreamLeft');
        const laserStreamRight = document.getElementById('laserStreamRight');
        const glassEmblem = document.getElementById('glassEmblem');
        const titleBlock = document.getElementById('titleBlock');
        const appleSkipBtn = document.getElementById('appleSkipBtn');
        const appleProgress = document.getElementById('appleProgress');

        let introTimeouts = [];

        function playAppleIntro() {
            introTimeouts.forEach(t => clearTimeout(t));
            introTimeouts = [];

            appleIntro.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.scrollTo({ top: 0, behavior: 'instant' });

            appleIntro.classList.remove('intro-dismissed');
            ambientAurora.classList.remove('ignited');
            precisionGrid.classList.remove('active');
            crystalBeam.classList.remove('active', 'faded');
            laserStreamsSvg.classList.remove('faded');
            glassEmblem.classList.remove('revealed');
            titleBlock.classList.remove('revealed');
            
            laserStreamLeft.style.strokeDashoffset = '1000';
            laserStreamRight.style.strokeDashoffset = '1000';
            appleProgress.style.width = '0%';

            // 1. İlerleme çubuğu (30ms)
            introTimeouts.push(setTimeout(() => {
                appleProgress.style.width = '100%';
            }, 20));

            // 2. Aurora ve Izgara Deseni (150ms)
            introTimeouts.push(setTimeout(() => {
                ambientAurora.classList.add('ignited');
                precisionGrid.classList.add('active');
            }, 80));

            // 3. Lazer Çizgileri ve Kristal Işık Huzmesi (300ms)
            introTimeouts.push(setTimeout(() => {
                laserStreamLeft.style.strokeDashoffset = '0';
                laserStreamRight.style.strokeDashoffset = '0';
                crystalBeam.classList.add('active');
            }, 180));

            // 4. 3D Cam Kaide & Logo Sahneye Çıkar (650ms)
            introTimeouts.push(setTimeout(() => {
                glassEmblem.classList.add('revealed');
                crystalBeam.classList.add('faded');
            }, 480));

            // 5. Yan Lazer Çizgileri Yavaşça Kaybolur, Sahne Temizlenir (900ms)
            introTimeouts.push(setTimeout(() => {
                laserStreamsSvg.classList.add('faded');
            }, 680));

            // 6. Net Tipografi & Slogan Işıkla Açılır (1050ms)
            introTimeouts.push(setTimeout(() => {
                titleBlock.classList.add('revealed');
            }, 780));

            // 7. Sinematik Yumuşak Geçiş (3.3s)
            introTimeouts.push(setTimeout(() => {
                finishAppleIntro();
            }, 2400));
        }

        function finishAppleIntro() {
            appleIntro.classList.add('intro-dismissed');
            introTimeouts.forEach(t => clearTimeout(t));
            document.body.style.overflow = '';

            setTimeout(() => {
                if (appleIntro.classList.contains('intro-dismissed')) {
                    appleIntro.style.display = 'none';
                }
            }, 650);
        }

        appleSkipBtn.addEventListener('click', finishAppleIntro);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', playAppleIntro);
        } else {
            playAppleIntro();
        }
    </script>
</body>
</html>
